# Redis Stack for semantic cache (includes RediSearch for vector similarity)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: vsr-egress-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
    spec:
      containers:
      - name: redis
        image: redis/redis-stack-server:7.4.0-v3
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: vsr-egress-demo
spec:
  selector:
    app: redis-cache
  ports:
  - port: 6379
    targetPort: 6379
